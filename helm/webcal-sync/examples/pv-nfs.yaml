# Example PersistentVolume using NFS
# Only needed if your cluster doesn't support dynamic provisioning

apiVersion: v1
kind: PersistentVolume
metadata:
  name: webcal-sync-pv
  labels:
    app: webcal-sync
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  nfs:
    # Replace with your NFS server details
    server: nfs-server.example.com
    path: /exports/webcal-sync
  storageClassName: ""  # Empty for manual binding
  persistentVolumeReclaimPolicy: Retain
