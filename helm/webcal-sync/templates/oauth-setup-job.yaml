{{- if .Values.oauthSetup.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "webcal-sync.fullname" . }}-oauth-setup
  labels:
    {{- include "webcal-sync.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth-setup
spec:
  ttlSecondsAfterFinished: {{ .Values.oauthSetup.ttlSecondsAfterFinished }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "webcal-sync.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: oauth-setup
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      containers:
      - name: webcal-sync
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: {{ include "webcal-sync.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        # Run with stdin/tty for interactive OAuth flow
        stdin: true
        tty: true
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if or .Values.persistence.enabled .Values.hostPath.enabled }}
        volumeMounts:
        - name: config
          mountPath: {{ .Values.persistence.mountPath }}
        {{- end }}
      {{- if or .Values.persistence.enabled .Values.hostPath.enabled }}
      volumes:
      - name: config
        {{- if .Values.hostPath.enabled }}
        hostPath:
          path: {{ .Values.hostPath.path }}
          type: DirectoryOrCreate
        {{- else }}
        persistentVolumeClaim:
          claimName: {{ include "webcal-sync.pvcName" . }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
