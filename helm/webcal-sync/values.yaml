# Default values for webcal-sync

image:
  repository: "akarnani/webcal_sync"
  pullPolicy: IfNotPresent
  tag: "" # Defaults to Chart.AppVersion; override with specific version if needed

# CronJob schedule (default: run every hour)
schedule: "0 * * * *"

# Healthcheck.io URL (pings /start, /, and /fail)
healthcheckUrl: ""

# Volume configuration for storing config files
persistence:
  enabled: true
  # Existing PVC or create new one
  existingClaim: ""
  # Storage class for dynamic provisioning
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  # Path where config files are mounted
  mountPath: /app/config

# HostPath volume (alternative to PVC for local development)
# Useful for Rancher Desktop, Docker Desktop, minikube, etc.
hostPath:
  enabled: false
  path: ""  # e.g., /Users/yourname/webcal-sync-config

# Resource limits
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Pod configuration
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}

# CronJob specific settings
cronjob:
  # Number of successful finished jobs to retain
  successfulJobsHistoryLimit: 3
  # Number of failed finished jobs to retain
  failedJobsHistoryLimit: 1
  # Restart policy for the job
  # Never spawns a new pod on each retry (preserving failed pod logs)
  # OnFailure restarts in the same pod, losing logs on restart
  restartPolicy: Never
  # Backoff limit for failed jobs
  backoffLimit: 3

# OAuth setup job configuration
oauthSetup:
  # Enable the oauth setup job (set to false after initial setup)
  enabled: false
  # TTL for the completed job (in seconds)
  ttlSecondsAfterFinished: 3600
