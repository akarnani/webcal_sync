name: Build Binary

on:
  workflow_run:
    workflows: ["Run Tests"]
    types:
      - completed
    branches:
      - main
      - '**'

jobs:
  build:
    name: Build binary
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - run: go version
      - run: go build *.go
