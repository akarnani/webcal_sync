name: Run Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Display Go version
        run: go version

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Display test coverage
        run: go tool cover -func=coverage.out
